org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx2048M"
org.gradle.caching=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 hizo incompatibles en el mismo módulo 'com.android.application' y
# 'org.jetbrains.kotlin.multiplatform'. Mantenemos el módulo único (idiomático en
# Compose Multiplatform) con el DSL/Kotlin clásicos de AGP. A revisar cuando el
# soporte KMP-app del nuevo DSL madure (posible migración a multi-módulo).
android.builtInKotlin=false
android.newDsl=false
