[versions]
agp = "9.4.0"
kotlin = "2.4.20"
compose = "1.9.3"
androidx-activityCompose = "1.13.0"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
javaKeyring = "1.0.4"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.8.1"
sshj = "0.39.0"
eddsa = "0.3.0"
bouncycastle = "1.78.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Config persistence (non-secret hosts/sessions/scripts): JSON on an app-private
# file. Secrets stay in the SecretStore (ADR-0001); config only holds refs.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Desktop SecretStore backend (ADR-0001): Windows Credential Store (DPAPI-backed)
# and Linux Secret Service via a single maintained JNA wrapper.
java-keyring = { module = "com.github.javakeyring:java-keyring", version.ref = "javaKeyring" }
# SSH client (ADR-0004): pure-Java, BouncyCastle optional since 0.39.0. Lives in
# the jvmShared source set. eddsa provides ed25519 (preferred key, ADR-0005).
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
eddsa = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }
# Full BouncyCastle: Android ships a stripped "BC" provider; sshj needs the real
# one for the algorithms a modern OpenSSH server negotiates (ADR-0004).
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
