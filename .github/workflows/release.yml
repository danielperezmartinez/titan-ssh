# Release pipeline (ADR-0011 §3): pushing a `vX.Y.Z[-(alpha|beta|rc).N]` tag on
# `main` builds every package and publishes them, with SHA256SUMS, in a single
# GitHub Release. A tag with a suffix becomes a pre-release (the internal
# channel). A manual run builds the same packages as workflow artifacts and
# publishes nothing, to try the pipeline without spending a version.
#
# The version comes only from the tag (or the manual input) and is passed to
# Gradle as -PtitanVersion, which validates it and derives every per-format
# version from it (root build.gradle.kts). A release version makes the level-3
# agent mandatory, so a missing Go toolchain fails the build.
#
# The agent job builds every titan-agent binary once. They are published with
# the Release, where the app downloads the targets it does not bundle
# (ADR-0010), and every other job takes these same files through
# -PtitanAgentPrebuilt, so the digests pinned in each app match the assets.
#
# Once the Release exists, the aur and winget jobs hand the new version to
# those package managers.
#
# Third-party actions are pinned by commit SHA and the Komac binary by its
# SHA-256. Secrets are only read by the Android, AUR and winget jobs, and this
# workflow never runs for pull requests.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build: X.Y.Z or X.Y.Z-(alpha|beta|rc).N (nothing is published)'
        required: true
        default: '0.0.1-alpha.1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  # The agent's go.mod only states the minimum language version; the shipped
  # binaries are built with a current, supported toolchain.
  GO_VERSION: '1.27.x'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # SHA-256 of the release signing certificate (public: it is inside every APK).
  # The Android job refuses to publish an APK signed with any other key, since
  # Obtainium and IzzyOnDroid users could not update over it.
  ANDROID_CERT_SHA256: 3929d8997ac2b23f61517a0561bbb10fe3d9e4a0a6547ee28e703c87c3ecdeab

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: resolve
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="${RAW#v}"
          # Gradle performs the authoritative check; this only fails fast.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$RAW': expected X.Y.Z or X.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version (pre-release: $prerelease)"

  agent:
    name: Agent binaries
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build
        run: ./gradlew :shared:agentReleaseAssets "-PtitanVersion=$VERSION" --console=plain
      - name: List
        working-directory: shared/build/agentBinaries/release
        run: ls -l && sha256sum -- *
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent
          path: shared/build/agentBinaries/release/
          if-no-files-found: error

  test:
    name: Tests
    needs: [version, agent]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Agent tests
        working-directory: agent
        run: go test -race -count=1 ./...
      - name: Desktop tests
        run: ./gradlew :shared:desktopTest "-PtitanVersion=$VERSION" "-PtitanAgentPrebuilt=$RUNNER_TEMP/agent" --console=plain

  android:
    name: Android APK and AAB
    needs: [version, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TITAN_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret TITAN_KEYSTORE_BASE64 is not set; an unsigned APK cannot be released"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          TITAN_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TITAN_KEY_ALIAS: ${{ secrets.TITAN_KEY_ALIAS }}
          TITAN_KEYSTORE_PASSWORD: ${{ secrets.TITAN_KEYSTORE_PASSWORD }}
          # PKCS12: the key shares the store password.
          TITAN_KEY_PASSWORD: ${{ secrets.TITAN_KEYSTORE_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease "-PtitanVersion=$VERSION" "-PtitanAgentPrebuilt=$RUNNER_TEMP/agent" --console=plain
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the signature and collect
        run: |
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          # Without a signing config AGP writes androidApp-release-unsigned.apk.
          test -f "$apk" || { echo "::error::No signed APK was produced"; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "certificate SHA-256 digest: $ANDROID_CERT_SHA256" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::The APK is not signed with the release key"; exit 1; }
          # Stable, unambiguous names: Obtainium picks the only .apk asset.
          mkdir dist
          cp "$apk" "dist/titan-ssh-$VERSION.apk"
          cp "$aab" "dist/titan-ssh-$VERSION.aab"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux deb, rpm and tar.gz
    needs: [version, agent]
    # jpackage takes the .deb dependencies from the build machine: one built on
    # 24.04 needs libpng16-16t64, missing from 22.04 and Debian 12. The .rpm
    # only ever declares xdg-utils (jpackage 21 looks up the library packages,
    # even inside Fedora, but does not write them), so it is built here too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # jpackage only declares the libraries it finds installed, so they are
      # installed explicitly instead of relying on the runner image.
      - name: Install packaging tools and the app's libraries
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          fakeroot rpm libx11-6 libxext6 libxi6 libxrender1 libxtst6 libasound2
          libfreetype6 libfontconfig1
      - name: Build
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:packageTarGz "-PtitanVersion=$VERSION" "-PtitanAgentPrebuilt=$RUNNER_TEMP/agent" --console=plain
      - name: Collect
        run: |
          mkdir dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb dist/
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm dist/
          cp desktopApp/build/compose/binaries/main/tar.gz/*.tar.gz dist/
          # GitHub turns `~` into `.` in asset names, which would break
          # SHA256SUMS. The version inside the packages keeps its `~`.
          # (A stable version has no `~`: nullglob skips the loop.)
          shopt -s nullglob
          for f in dist/*~*; do mv "$f" "${f//\~/-}"; done
          ls -l dist
          dpkg-deb --field dist/*.deb Depends
          rpm -qpR dist/*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows MSI
    needs: [version, agent]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build
        run: ./gradlew :desktopApp:packageMsi "-PtitanVersion=$VERSION" "-PtitanAgentPrebuilt=$RUNNER_TEMP/agent" --console=plain
      - name: Collect
        run: |
          # jpackage names the MSI after its internal X.Y.(Z*100+S) version;
          # the published name carries the real one.
          mkdir dist
          cp desktopApp/build/compose/binaries/main/msi/*.msi "dist/titan-ssh-$VERSION-windows-x64.msi"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    if: github.event_name == 'push'
    needs: [version, agent, test, android, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "titan-ssh $VERSION" \
            --generate-notes \
            "${flags[@]}"

  # ADR-0011 §4: package managers fed from the published Release. Stable
  # versions go to titan-ssh-bin / DanielPerezMartinez.TitanSSH and
  # pre-releases to titan-ssh-beta-bin / DanielPerezMartinez.TitanSSH.Beta, so
  # stable users never get a beta. Each channel's first version is submitted by
  # hand (see the task notes); from then on these jobs keep them up to date.
  # Each job only runs once its repository variable (AUR_ENABLED,
  # WINGET_ENABLED) is 'true', i.e. after that first version exists: before,
  # it would fail on every release.
  aur:
    name: Publish to AUR
    if: github.event_name == 'push' && vars.AUR_ENABLED == 'true'
    needs: [version, publish]
    runs-on: ubuntu-latest
    # makepkg only exists on Arch.
    container: archlinux:base-devel
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install git and ssh
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: dist
      - name: Build the package
        run: |
          sha256="$(sha256sum "dist/titan-ssh-$VERSION-linux-x64.tar.gz" | cut -d' ' -f1)"
          desktopApp/packaging/aur/render.sh "$VERSION" "$sha256" /tmp/aur
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder /tmp/aur
          # Downloads the tar.gz from the Release and checks it against the
          # SHA-256 of the one built here; -d skips installing the runtime
          # dependencies, which packaging does not need.
          runuser -u builder -- bash -c 'cd /tmp/aur && makepkg -fd --noconfirm && makepkg --printsrcinfo > .SRCINFO'
      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Secret AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cp desktopApp/packaging/aur/known_hosts ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          pkgname="$(sed -n 's/^pkgname=//p' /tmp/aur/PKGBUILD)"
          # Cloning a package that does not exist yet gives an empty repository,
          # and the first push creates it.
          git clone "ssh://aur@aur.archlinux.org/$pkgname.git" /tmp/repo
          cp /tmp/aur/PKGBUILD /tmp/aur/.SRCINFO /tmp/repo/
          cd /tmp/repo
          git config user.name 'Daniel Pérez Martínez'
          git config user.email 'danielperezmartinez@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "$pkgname is already at $VERSION"
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin HEAD:master
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/aur

  winget:
    name: Submit to winget
    if: github.event_name == 'push' && vars.WINGET_ENABLED == 'true'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      # Komac opens the pull request on microsoft/winget-pkgs from the token
      # owner's fork, and reads the MSI to fill ProductCode, UpgradeCode and the
      # DisplayVersion (the MSI's X.Y.(Z*100+S) version). Pinned by hash.
      KOMAC_VERSION: '2.16.0'
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Install Komac
        run: |
          archive="$RUNNER_TEMP/komac.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" komac
      - name: Open the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -z "$GITHUB_TOKEN" ]]; then
            echo "::error::Secret WINGET_TOKEN is not set"
            exit 1
          fi
          id=DanielPerezMartinez.TitanSSH
          [[ "$PRERELEASE" == true ]] && id+=.Beta
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          "$RUNNER_TEMP/komac" update "$id" \
            --version "$VERSION" \
            --urls "$base/download/$GITHUB_REF_NAME/titan-ssh-$VERSION-windows-x64.msi" \
            --release-notes-url "$base/tag/$GITHUB_REF_NAME" \
            --submit
