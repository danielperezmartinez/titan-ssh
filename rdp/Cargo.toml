[package]
name = "titan-rdp"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Embedded RDP client of titan-ssh: IronRDP behind a small JNI surface (ADR-0028)."
publish = false

[lib]
name = "titan_rdp"
# cdylib: the library the app loads; rlib: the examples and tests link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-graphics = "0.9"
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"
ironrdp-core = "0.2"
ironrdp-tokio = "0.10"
ironrdp-dvc = "0.8"
ironrdp-displaycontrol = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "macros", "time"] }
# ring instead of aws-lc-rs: it cross-compiles to Android with just the NDK clang.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
sha2 = "0.10"
jni = "0.21"
smallvec = "1"

[dev-dependencies]
tokio = { version = "1", features = ["net"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwinding stays on: every JNI entry point catches a panic instead of
# aborting the app.
panic = "unwind"
